<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reservationPage.css">
</head>
<body>

    <header class="header">
      <div class="logo">
        <img src="images/logo.png" alt="Logo" height="120px">
        <span>Restaurant</span>
      </div>
      <div class="nav-bar">
        <a href="homepage.html">Home</a>
        <a href="">Eat & Drink</a>
        <a href="">Contact</a>
        <a href="">About</a>
        <img src="images/icon.png" id="icon" alt="pr">
      </div>
    </header>

    <div class="img">
      <div class="bg"></div>

    <div class="box">
      <h1 id="h1"><strong>Mire se erdhet ne platformen per Reservime Online</strong></h1><br>
      <br> 
      <form action="">

          <label for="name">
            <input type="name" id="name" placeholder="Emri">
          </label><br>

          <label for="capacity">
            <input type="number" id="capacity" placeholder="Numri i personave ne tavoline">
          </label><br>

          <label for="date">
            <input type="date" id="date" placeholder="Data dhe koha e rezervimit">
          </label><br>

          <label for="text">
            <input type=" text" id="text" placeholder="Shenoni ndonje kerkese shtese">
          </label> <br>

          <button class="submit">Dergo</button>
        </form>
        </div>
      </div>

      <script>
      const user = localStorage.getItem("user");
      if (!user) {
      alert("Ju duhet të regjistroheni ose kyçeni për të rezervuar!");
      window.location.href = "loginpage.html";
      }
      </script>

    
</body>
</html>
