<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reservationPage.css">
    <link rel="stylesheet" href="header.css">
</head>
<body>
     <div class="header">
      <div class="left-section">
        <img src="images/logo.png" alt="Logo" height="150px" width="150px">
      </div>
      <div class="middle-section">
            <a href="">Home</a>
            <a href="">Eat & Drink</a>
            <a href="">Contact</a>
            <a href="">About</a>
      </div>
      <div class="right-section">
            <img src="images/icon.png" height="90px">
      </div>
      </div>
    
    <div class="img">
      <div class="bg"></div>

    <div class="box">
      <div class="titulli">
        <h1 id="h1"><strong>Mire se erdhet ne platformen per Reservime Online</strong></h1><br>
      <br> 
      </div>
      <form action="">
          <div class="name-box">
            <label for="name">
            <input type="name" id="name" placeholder="Emri">
          </label><br>
          </div>
          <div class="capacity-box">
            <label for="capacity">
            <input type="number" id="capacity" placeholder="Numri i personave ne tavoline">
            </label>
          </div>
          <div class="date-box">
            <label for="date">
            <input type="date" id="date" placeholder="Data dhe koha e rezervimit">
            </label>
          </div>
          <div class="text-box">
            <label for="text">
            <input type=" text" id="text" placeholder="Shenoni ndonje kerkese shtese">
            </label> 
          </div>
          <div class="button-box">
            <button class="submit">Dergo</button>
          </div>
          
        </form>
        </div>
      </div>

      <script>
      const user = localStorage.getItem("user");
      if (!user) {
      alert("Ju duhet të regjistroheni ose kyçeni për të rezervuar!");
      window.location.href = "loginpage.html";
      }
      </script>

    
</body>
</html>
