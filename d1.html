<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="input()">Kliko ketu</button>
    <script>
    function input(){
    let emri;
    while (emri == "" || emri == null ){
        emri = prompt ("Sheno emrin")
    }

    let mosha;
    while (mosha == "" || mosha == null){
        mosha = prompt ("Sheno moshen")
    }

    alert(emri+" "+mosha)
    
}
    </script>
    



<button onclick="llogaritShumen()">Kliko per te futur numrat</button>

<script>
    function llogaritShumen(){
        let num1=prompt("Shkuaj numrin e pare:");
        let num2=prompt("Shkruaj numrin e dyte:");

        num1 = Number(num1);
        num2 = Number(num2);

        let shuma=num1+num2;

        alert("Shuma e ketyre numrave eshte: "+shuma);
    }
</script>

<button onclick="input1()">Bashkimi i fjaleve</button>
<script>
    function input1(){
        let fjala1;
        while(fjala1==""||fjala1==null){
            fjala1=prompt ("Sheno fjalen e pare")
        }

        let fjala2;
        while(fjala2==""||fjala2==null){
            fjala2=prompt ("Sheno fjalen e dyte")
        }

        alert(fjala1+" "+fjala2)
    }
</script>
</body>
