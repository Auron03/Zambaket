<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <button onclick="input()">Kliko ketu</button>
    <script>
    function input(){
    let emri;
    while (emri == "" || emri == null ){
        emri = prompt ("Sheno emrin")
    }

    let mosha;
    while (mosha == "" || mosha == null){
        mosha = prompt ("Sheno moshen")
    }

    alert(emri+" "+mosha)
    
}
    </script>
    



<button onclick="llogaritShumen()">Kliko per te futur numrat</button>

<script>
    function llogaritShumen(){
        let num1=prompt("Shkuaj numrin e pare:");
        let num2=prompt("Shkruaj numrin e dyte:");

        num1 = Number(num1);
        num2 = Number(num2);

        let shuma=num1+num2;

        alert("Shuma e ketyre numrave eshte: "+shuma);
    }
</script>


    <button onclick ="ciftTek()">Kliko per te futur Numer </button>
    <script>
    function ciftTek (){
        let numri;
        while (numri == " " || numri == null){
            let numri = prompt ("Sheno numrin");
            if (numri % 2 == 0){
                alert(numri+" Numer cift");
            }
            else if (numri%2 != 0){
                alert(numri+" Numer tek");
            }
        }
    }
</script>



</body>
