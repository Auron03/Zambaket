<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginForm</title>
    <link rel="stylesheet" href="loginpage.css">
</head>
<body>
   <div class="img1">
  <div class="register">
    <form>
      <img src="userIcon.png" alt="User Icon" height="80px">
      <br>

      <label for="firstname"></label><br>
      <input type="text" id="firstname" placeholder="First Name"><br>

      <label for="lastname"></label><br>
      <input type="text" id="lastname" placeholder="Last Name"><br>

      <label for="email"></label><br>
      <input type="email" id="email" placeholder="Email"><br>

      <label for="password"></label><br>
      <input type="password" id="password" placeholder="Password"><br>

      <label for="re-password"></label><br>
      <input type="password" id="re-password" placeholder="Re-type Password"><br>

      <label></label><br>
      <input type="radio" name="gender" value="M" id="male">
      <label for="male">Male</label>
      <input type="radio" name="gender" value="F" id="female">
      <label for="female">Female</label><br>

      <label for="phone"></label><br>
      <input type="text" id="phone" placeholder="Phone number"><br>

      <label for="country"></label><br>
      <select name="country" id="country">
        <option value="Kosove">Kosove</option>
        <option value="Shqiperi">Shqiperi</option>
        <option value="Montenegro">Montenegro</option>
        <option value="Spain">Spain</option>
      </select><br>

      <input type="checkbox" id="term1">
      <label for="term1">I agree with terms and conditions</label><br>

      <input type="submit" id="submit" value="Register">
    </form>
  </div>
</div>
    
</body>
</html>
